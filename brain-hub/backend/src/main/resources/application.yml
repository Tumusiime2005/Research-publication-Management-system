server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: brain-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brain_hub_db}
    username: ${SPRING_DATASOURCE_USERNAME:brain_user}
    password: ${SPRING_DATASOURCE_PASSWORD:brain_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:4c7e9a8f2b1d6c0e5a8f7b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://brain-hub.vercel.app}
    admin-bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:BH-BOOTSTRAP-SECURE-KEY-2026}
  storage:
    provider: ${STORAGE_PROVIDER:local} # local or s3
    local-upload-dir: ${STORAGE_LOCAL_DIR:./uploads/publications}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket-name: ${S3_BUCKET_NAME:brain-hub-publications}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
