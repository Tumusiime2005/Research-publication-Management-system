version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: brainhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain_hub_db
      POSTGRES_USER: brain_user
      POSTGRES_PASSWORD: brain_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_user -d brain_hub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brainhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brain_hub_db
      SPRING_DATASOURCE_USERNAME: brain_user
      SPRING_DATASOURCE_PASSWORD: brain_secure_pass_2026
      JWT_SECRET: 4c7e9a8f2b1d6c0e5a8f7b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      ADMIN_BOOTSTRAP_TOKEN: BH-BOOTSTRAP-SECURE-KEY-2026
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/uploads/publications
    ports:
      - "8080:8080"
    volumes:
      - publication_uploads:/app/uploads/publications

  # 3. Local S3-Compatible Storage (MinIO) for Production Simulation
  minio:
    image: minio/minio:latest
    container_name: brainhub-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  publication_uploads:
  minio_data:
